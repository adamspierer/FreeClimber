##
## Per-fly trajectory linking (optional; defaults shown).
## Uncomment and set analysis_mode='individual' to link detections into
## per-fly tracks with TrackPy and write a <video>.tracks.csv file.
## Leave commented (or 'cohort') to keep the standard cohort analysis.
#analysis_mode='cohort'
#link_search_range=15
#link_memory=3
#link_predictor='nearest_velocity'
#link_min_track_length=5
##
## Per-fly tortuosity metrics (optional; defaults shown).
## Active only when analysis_mode='individual'. Bout segmentation is done
## from per-frame vertical climbing velocity (mm/s) independent of FNG
## events; bouts are then filtered by minimum length (frames) and minimum
## vertical displacement (mm). Coordinates are smoothed by a Savitzky-Golay
## filter of the configured window before all metric computations.
#tortuosity_enabled=True
#tortuosity_smoothing_window=5
#tortuosity_velocity_threshold=1.0
#tortuosity_bout_min_frames=10
#tortuosity_bout_min_displacement=2.0
##
## FNG detection (optional; defaults shown). fng_min_range_cm keeps jitter in
## vials where nobody climbs from being scored as falls; 0 = old behavior.
#fng_enabled=True
#fng_smooth_window=5
#fng_climb_thresh=0.10
#fng_fall_thresh=0.10
#fng_min_gap=5
#fng_min_range_cm=2.0
##
## Failure to climb (optional; defaults shown). A fly that never gets
## ftc_height_cm above the vial floor within ftc_window_sec (None = whole
## cropped video), and never falls, failed to climb. ftc_height_cm=None puts
## the line at the top of the ROI box (less one spot diameter). Heights are
## measured from floor_y (pixels from the top of the ROI; None = ROI bottom). flies_per_vial (int or a
## left-to-right list) lets undetected, motionless flies still count; a
## vials.txt 'n =' line overrides it per folder. background_image is an
## optional picture of the empty vials (same resolution as the video).
#ftc_enabled=True
#ftc_height_cm=None
#ftc_window_sec=None
#ftc_start_frame=0
#ftc_eval_frames=5
#ftc_min_coverage=0.8
#flies_per_vial=None
#floor_y=None
#background_image=None
